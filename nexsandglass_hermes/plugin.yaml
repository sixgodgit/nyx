name: nyx
version: 7.15.4
description: >-
  Nyx — local, single-user agent memory with no API key: bi-temporal facts (what is believed now / what was
  believed then), source and trust bound at write time (against memory poisoning), two-stage forgetting
  (restorable quarantine), Déjà Vu familiarity. Needs pip install nyx-memory first.
