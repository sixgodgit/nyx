[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-memory"
dynamic = ["version"]
description = "夜神 Nyx — 跨会话记忆感知系统。把「检索失败」也当作一类信号：Déjà Vu 告诉 agent 它是否曾经见过。"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["memory", "agent", "ai", "knowledge-graph", "dejavu", "bloom-filter", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
mcp = ["mcp>=0.9.0"]
test = ["pytest>=7.0"]
vector = ["sentence-transformers>=2.0", "numpy>=1.20"]
api = ["httpx>=0.24"]
chroma = ["chromadb>=0.4"]
sqlitevec = ["sqlite-vec>=0.1"]

# Hermes Agent 记忆提供器（官方发现机制：entry point 组 hermes_agent.memory_providers）
# 配置里写 memory.provider: nyx（旧名 nexsandglass 同样可用）
[project.entry-points."hermes_agent.memory_providers"]
nyx = "nexsandglass_hermes"
nexsandglass = "nexsandglass_hermes"

[tool.setuptools.dynamic]
version = {attr = "nexsandglass.__version__"}

[tool.setuptools.package-data]
nexsandglass_hermes = ["plugin.yaml", "README.md"]

[tool.setuptools.packages.find]
include = ["nexsandglass*"]
exclude = ["tests*", "experiments*", "scripts*"]
