name: nyx
version: 7.16.0
kind: exclusive
# 从这一版起 hermes plugins install 会装 python_dependencies（v2026.9.21）；更老的走 python3 -m nexsandglass_hermes install
requires_hermes: ">=0.21.4"
author: sixgodgit
description: >-
  Nyx — local, single-user long-term memory with no LLM on the write path: bi-temporal facts,
  source trust, recoverable forgetting, secrets kept out of memory (optional encrypted vault).
  Nyx 夜神：单用户、本地的长期记忆。
# Hermes 安装插件时把它装进自己的环境（hermes update 之后重新应用）。Hermes 本身已带 cryptography，保险箱不用另装
python_dependencies:
  - nyx-memory>=7.15.2,<8
